<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIKA SHOP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <div class="logo">RAIKA SHOP</div>

        <div class="search">
            <input type="text" placeholder="商品を検索">
            <button>検索</button>
        </div>

        <div class="cart">
            🛒 カート
        </div>
    </header>


    <!-- ナビゲーション -->
    <nav>
        <span>カテゴリー</span>
        <span>おすすめ</span>
        <span>新着商品</span>
        <span>セール</span>
    </nav>


    <!-- メイン -->
    <main>

        <section class="hero">
            <h1>欲しいものが、きっと見つかる。</h1>
            <p>RAIKA SHOPへようこそ</p>
        </section>


        <h2>おすすめ商品</h2>

        <section class="products">

            <div class="product">
               <img src="images/earphone.png" alt="ワイヤレスイヤホン">
                <h3>ワイヤレスイヤホン</h3>
                <p class="price">¥4,980</p>
                <button>カートに入れる</button>
            </div>

            <div class="product">
                 <img src="images/smart watch.png" alt="スマートウォッチ">
                <h3>スマートウォッチ</h3>
                <p class="price">¥8,980</p>
                <button>カートに入れる</button>
            </div>

            <div class="product">
                <img src="images/speaker.png" alt="Bluetoothスピーカー">
                <h3>Bluetoothスピーカー</h3>
                <p class="price">¥3,980</p>
                <button>カートに入れる</button>
            </div>

            <div class="product">
                <img src="images/mouse.png" alt="ゲーミングマウス">
                <h3>ゲーミングマウス</h3>
                <p class="price">¥5,480</p>
                <button>カートに入れる</button>
            </div>

        </section>

    </main>


    <!-- フッター -->
    <footer>
        <p>© 2026 RAIKA SHOP</p>
    </footer>

</body>
</html>
